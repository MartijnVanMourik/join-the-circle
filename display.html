<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stap in de cirkel — Digibord</title>
<link rel="stylesheet" href="css/display.css?v=20">
</head>
<body>

<div id="page">
  <div id="arena-wrapper">
    <div id="arena">
      <div id="center-circle">
        <span id="center-word"></span>
        <span id="session-code-hint"></span>
      </div>
      <div id="participants-layer"></div>
    </div>
  </div>

  <div id="side-panel">
    <div id="panel-lobby">
      <h2>Sessiecode: <span id="lobby-code"></span></h2>
      <p>Wachten tot de organisator start...</p>
      <p class="hint"><span id="lobby-count">0</span> deelnemers aangemeld</p>
    </div>

    <div id="panel-statement" class="hidden">
      <p id="panel-progress"></p>
      <h2 id="panel-statement-text"></h2>
      <div class="time-bar"><div id="panel-time-fill" class="time-bar-fill"></div></div>
      <div id="panel-tally" class="hidden">
        <span class="tally-agree"><span class="tally-icon tally-icon-agree">✓</span> Mee eens: <strong id="panel-tally-agree"></strong></span>
        <span class="tally-disagree"><span class="tally-icon tally-icon-disagree">✕</span> Niet mee eens: <strong id="panel-tally-disagree"></strong></span>
      </div>
      <button id="panel-next-btn" class="hidden" disabled>Volgende stelling →</button>
    </div>

    <div id="panel-finished" class="hidden">
      <h2>🏁 Bedankt voor het meedoen!</h2>
    </div>

    <div id="legend"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js?v=20"></script>
<script src="js/shared.js?v=20"></script>
<script src="js/display.js?v=20"></script>
</body>
</html>
